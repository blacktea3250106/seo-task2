[project]
name = "seo-agent"
version = "0.1.0"
description = "Task2: LangGraph Planner/Auditor negotiation for YMYL SEO outlines"
requires-python = ">=3.11,<3.14"
dependencies = [
  # Hermes v2026.9.24 (commit f97608f). Hermes refuses wheel/sdist builds (editable only),
  # so tools/fetch_hermes.py fetches the sha256-verified commit tarball into vendor/hermes-agent.
  "hermes-agent",
  "pydantic>=2.13,<3",
  "langgraph>=1.2,<2",
  # pinned-IP transport for model calls
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
anthropic = [
    "anthropic==0.87.0",
]

[tool.uv.sources]
hermes-agent = { path = "vendor/hermes-agent", editable = true }

[project.scripts]
seo-agent = "seo_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires real product model / paid services (blocked unless configured)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# 中文訊息字串較長，硬切會降低可讀性
ignore = ["E501"]
